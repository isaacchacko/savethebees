<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <nav class="tabs">
      <button type="button" data-view="add" class="on">add</button>
      <button type="button" data-view="manage">manage</button>
      <button type="button" id="settings" class="right" title="options">opts</button>
    </nav>

    <div class="scroll">
    <section id="view-add">
      <label for="list">list</label>
      <select id="list"></select>

      <div id="new-list-row" hidden>
        <label for="new-list">new list name</label>
        <input id="new-list" type="text" placeholder="cool webrings" />
      </div>

      <label for="title">title</label>
      <input id="title" type="text" />

      <label for="entry-label">label</label>
      <input id="entry-label" type="text" placeholder="optional — the link reads as this" />

      <label for="url">url</label>
      <input id="url" type="text" />

      <label for="note">note</label>
      <input id="note" type="text" placeholder="optional — [links](url) work" />

      <label class="check">
        <input id="is-private" type="checkbox" />
        <span>private — only shown on the site with the password</span>
      </label>

      <label class="check">
        <input id="use-shot" type="checkbox" checked />
        <span id="shot-label">screenshot</span>
      </label>
      <img id="shot-preview" alt="" hidden />

    </section>

    <section id="view-manage" hidden>
      <div id="lists"></div>
      <button type="button" id="add-list">+ new list</button>
    </section>
    </div>

    <footer class="actions">
      <button type="button" id="save" class="primary">save</button>

      <p class="or"><span>OR</span></p>

      <button type="button" id="edit-this" class="primary" hidden>edit this page</button>
      <button type="button" id="admin" class="primary">edit website</button>

      <p id="status"></p>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
